      responses:
        '200':
          description: Invitation acceptée ; le chien rejoint ma liste.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Invitation inexistante, déjà traitée ou adressée à un autre e-mail.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { status: 404, code: INVITATION_NOT_FOUND, title: Invitation not found }

  /invitations/{invitationId}/decline:
    parameters:
      - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Partage]
      operationId: declineInvitation
      summary: Refuser une invitation
      description: |
        Écran M6. L'invitation passe `declined` (`responded_at`) ; le chef peut en envoyer une nouvelle.
      x-status: provisoire
      x-depends-on: [T1, Q3]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Invitation refusée.
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Invitation inexistante, déjà traitée ou adressée à un autre e-mail.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { status: 404, code: INVITATION_NOT_FOUND, title: Invitation not found }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Jeton d'accès court (convention 6, dépend de T1).

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email, password, acceptedTermsVersion]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        phoneNumber:
          type: [string, 'null']
          maxLength: 20
          description: Facultatif (BDD nullable ; la maquette le demande sans l'exiger). Format E.164.
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: 8 caractères minimum (hypothèse D14 ; la maquette en demande 6).
        acceptedTermsVersion:
          type: string
          maxLength: 20
          description: Version des CGU acceptée par l'utilisateur (RG11, D13).

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, maxLength: 128, writeOnly: true }

    User:
      type: object
      required: [id, firstName, lastName, email, phoneNumber, registeredAt]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phoneNumber: { type: [string, 'null'] }
        registeredAt: { type: string, format: date-time }

    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        phoneNumber:
          type: [string, 'null']
          maxLength: 20
          description: Format E.164 ; `null` efface le numéro.

    Preferences:
      type: object
      required: [deviceLocationSharing, healthNotifications, anonymizedDataSharing]
      properties:
        deviceLocationSharing:
          type: boolean
          description: Position du téléphone de l'utilisateur envoyée à Pawrise (pas celle du chien). Vrai par défaut.
        healthNotifications:
          type: boolean
          description: Alertes en cas d'anomalie de santé détectée. Vrai par défaut.
        anonymizedDataSharing:
          type: boolean
          description: Consentement à l'usage des données anonymisées pour la recherche vétérinaire. Faux par défaut (RGPD, consentement explicite).

    UpdatePreferencesRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        deviceLocationSharing: { type: boolean }
        healthNotifications: { type: boolean }
        anonymizedDataSharing: { type: boolean }

    Pet:
      type: object
      required: [id, name, photoUrl, photoSample, birthDate, sex, breeds, weightKg, heightCm, medicalNotes, myRole, collarSerial]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        photoUrl: { type: [string, 'null'], format: uri, description: "Ma propre photo, hébergée par Pawrise. `null` si photo d'exemple ou aucune photo." }
        photoSample:
          oneOf:
            - { $ref: '#/components/schemas/SamplePhotoKey' }
            - { type: 'null' }
          description: "Clé de la photo d'exemple embarquée dans l'app. `photoUrl` et `photoSample` à `null` : l'app affiche `sample_1`."
        birthDate: { type: [string, 'null'], format: date }
        sex:
          type: string
          enum: [male, female, unknown]
          description: "`unknown` = « non renseigné » dans la maquette (D2)."
        breeds:
          type: array
          description: Race principale en premier (`pet_breed.is_primary`). Liste vide = race inconnue (D2).
          items: { $ref: '#/components/schemas/Breed' }
        weightKg: { type: [number, 'null'], description: Dernière pesée. }
        heightCm: { type: [number, 'null'], description: Absent de la BDD (D2). }
        medicalNotes: { type: [string, 'null'], description: Infos santé en texte libre ; absent de la BDD (D2). }
        myRole:
          type: string
          enum: [chief, secondary]
          description: Mon rôle sur ce chien (RG15, `pet_owner.owner_role`).
        collarSerial:
          type: [string, 'null']
          description: Code du collier associé (`PW-XXXXXX` = `serial_number`, D9) ; `null` si aucun collier.

    CreatePetRequest:
      type: object
      additionalProperties: false
      required: [name, sex]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        birthDate: { type: [string, 'null'], format: date }
        sex:
          type: string
          enum: [male, female, unknown]
          description: La maquette exige mâle ou femelle ; l'API accepte aussi `unknown` (D2).
        breedCodes:
          type: array
          default: []
          items: { type: string }
          description: Codes de `GET /breeds`, race principale en premier. Vide = race inconnue.
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0 }
        heightCm: { type: [number, 'null'], exclusiveMinimum: 0 }
        medicalNotes: { type: [string, 'null'], maxLength: 2000 }

    PetOwner:
      type: object
      required: [userId, name, email, role, isMe, invitationId]
      properties:
        userId: { type: [string, 'null'], format: uuid, description: "`null` pour une invitation en attente." }
        name: { type: [string, 'null'], description: "Prénom + nom ; `null` pour une invitation en attente." }
        email: { type: string, format: email }
        role: { type: string, enum: [chief, secondary, pending] }
        isMe: { type: boolean, description: "« vous » dans la maquette." }
        invitationId: { type: [string, 'null'], format: uuid }

    ReceivedInvitation:
      type: object
      required: [id, invitedAt, pet, invitedBy]
      properties:
        id: { type: string, format: uuid }
        invitedAt: { type: string, format: date-time }
        pet:
          type: object
          required: [id, name, photoUrl, photoSample]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            photoUrl: { type: [string, 'null'], format: uri }
            photoSample:
              oneOf: [{ $ref: '#/components/schemas/SamplePhotoKey' }, { type: 'null' }]
        invitedBy:
          type: object
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string, format: email }

    ChatMessage:
      type: object
      required: [id, role, content, sentAt, quickReplies]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [owner, ai, vet], description: "`message.sender_role` ; `vet` réservé à l'escalade (hors sprint 1)." }
        content: { type: string }
        sentAt: { type: string, format: date-time }
        quickReplies:
          type: array
          items: { type: string }
          description: Suggestions de réponse proposées par l'IA (vide sinon) ; nouvelle colonne `message.quick_replies` (D12).

    Notification:
      type: object
      required: [id, petId, kind, title, createdAt, read, alertId, reminderId]
      properties:
        id: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        kind:
          type: string
          enum: [health, map, reminder, vet]
          description: Écran à ouvrir au toucher (Santé, Localisation, Rappels, Rendez-vous).
        title: { type: string, description: Texte affiché, en français (généré par l'API). }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        alertId: { type: [string, 'null'], format: uuid, description: Alerte à l'origine de la notification. }
        reminderId: { type: [string, 'null'], format: uuid, description: Rappel concerné. }

    Zone:
      type: object
      required: [id, petId, name, emoji, latitude, longitude, radiusM, alertsEnabled, petInside]
      properties:
        id: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        emoji: { type: string, maxLength: 8 }
        latitude: { type: number, description: Centre, degrés WGS84. }
        longitude: { type: number }
        radiusM: { type: integer, minimum: 20, maximum: 2000 }
        alertsEnabled: { type: boolean, description: Alerte de sortie active. }
        petInside: { type: [boolean, 'null'], description: "Chien dans la zone à sa dernière position ; `null` sans position." }

    CreateZoneRequest:
      type: object
      additionalProperties: false
      required: [name, latitude, longitude, radiusM]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        emoji: { type: string, maxLength: 8, default: "📍" }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radiusM: { type: integer, minimum: 20, maximum: 2000 }
        alertsEnabled: { type: boolean, default: true }

    UpdateZoneRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        emoji: { type: string, maxLength: 8 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radiusM: { type: integer, minimum: 20, maximum: 2000 }
        alertsEnabled: { type: boolean }

    GeoPoint:
      type: object
      required: [latitude, longitude, recordedAt]
      properties:
        latitude: { type: number, description: Degrés WGS84 (convention 8). }
        longitude: { type: number }
        recordedAt: { type: string, format: date-time }

    PetLocation:
      type: object
      required: [latitude, longitude, recordedAt, stale, connected, batteryPct, collarSerial]
      properties:
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        recordedAt: { type: [string, 'null'], format: date-time, description: Heure de la dernière position reçue. }
        stale: { type: boolean, description: Position de plus de 3 min. }
        connected: { type: boolean }
        batteryPct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        collarSerial: { type: string }

    ReminderKind:
      type: string
      enum: [vaccine, treatment, other]
      description: "« Vaccin », « Traitement », « Autre soin »."

    Reminder:
      type: object
      required: [id, petId, kind, title, dueAt, doneAt, status]
      properties:
        id: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ReminderKind' }
        title: { type: string, maxLength: 100 }
        dueAt: { type: string, format: date-time, description: Échéance (date et heure, comme la maquette). }
        doneAt: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [upcoming, overdue, done], description: Calculé par l'API. }

    CreateReminderRequest:
      type: object
      additionalProperties: false
      required: [kind, title, dueAt]
      properties:
        kind: { $ref: '#/components/schemas/ReminderKind' }
        title: { type: string, minLength: 1, maxLength: 100 }
        dueAt: { type: string, format: date-time }

    UpdateReminderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        kind: { $ref: '#/components/schemas/ReminderKind' }
        title: { type: string, minLength: 1, maxLength: 100 }
        dueAt: { type: string, format: date-time }
        done: { type: boolean, description: "`true` = marquer effectué ; `false` = rouvrir." }

    IndicatorCode:
      type: string
      enum: [heart_rate, atrial_fibrillation, activity, sleep, temperature]

    IndicatorDetail:
      type: object
      required: [indicator, period, unit, state, current, message, detail, normalRange, points]
      properties:
        indicator: { $ref: '#/components/schemas/IndicatorCode' }
        period: { type: string, enum: [today, 7d, 30d] }
        unit: { type: string, enum: [bpm, count, min, celsius], description: "Fixe par indicateur ; exception à la convention 8 (unité dans le nom du champ), car la série est commune aux 5 indicateurs." }
        state:
          oneOf: [{ $ref: '#/components/schemas/HealthState' }, { type: 'null' }]
        current: { type: [number, 'null'], description: "Valeur actuelle (titre de l'écran), dans `unit`." }
        message: { type: [string, 'null'], description: Message simple, sans connaissance médicale (IA-ENGINE). }
        detail: { type: [string, 'null'], description: Explication un peu plus poussée (IA-ENGINE). }
        normalRange:
          oneOf:
            - type: object
              required: [min, max]
              properties:
                min: { type: number }
                max: { type: number }
            - { type: 'null' }
          description: Plage habituelle tracée sur la courbe ; `null` si l'indicateur n'en a pas.
        points:
          type: array
          items:
            type: object
            required: [at, value]
            properties:
              at: { type: string, format: date-time, description: Début de l'heure ou du jour (UTC). }
              value: { type: [number, 'null'] }

    HealthState:
      type: string
      enum: [good, watch, alert]
      description: "« Tout va bien », « À surveiller », « Alerte » dans la maquette."

    HealthDashboard:
      type: object
      required: [score, state, summary, indicators, collar]
      properties:
        score: { type: [integer, 'null'], minimum: 0, maximum: 100, description: Score bien-être (IA-ENGINE). }
        state:
          oneOf: [{ $ref: '#/components/schemas/HealthState' }, { type: 'null' }]
        summary: { type: [string, 'null'], description: Message de synthèse en langage simple (IA-ENGINE). }
        indicators:
          type: object
          required: [heartRate, atrialFibrillation, activity, sleep, temperature]
          description: Les 5 indicateurs du MVP. Chaque indicateur vaut `null` sans mesure.
          properties:
            heartRate:
              oneOf:
                - type: object
                  required: [state, heartRateBpm]
                  properties:
                    state: { $ref: '#/components/schemas/HealthState' }
                    heartRateBpm: { type: integer, description: Moyenne des dernières 24 h. }
                - { type: 'null' }
            atrialFibrillation:
              oneOf:
                - type: object
                  required: [state, irregularBeatDetected]
                  properties:
                    state: { $ref: '#/components/schemas/HealthState' }
                    irregularBeatDetected: { type: boolean }
                - { type: 'null' }
            activity:
              oneOf:
                - type: object
                  required: [state, activityMin]
                  properties:
                    state: { $ref: '#/components/schemas/HealthState' }
                    activityMin: { type: integer, description: Minutes actives depuis minuit. }
                - { type: 'null' }
            sleep:
              oneOf:
                - type: object
                  required: [state, sleepMin]
                  properties:
                    state: { $ref: '#/components/schemas/HealthState' }
                    sleepMin: { type: integer, description: Sommeil de la dernière nuit. }
                - { type: 'null' }
            temperature:
              oneOf:
                - type: object
                  required: [state, temperatureC]
                  properties:
                    state: { $ref: '#/components/schemas/HealthState' }
                    temperatureC: { type: number, description: Dernière mesure. }
                - { type: 'null' }
        collar:
          oneOf:
            - type: object
              required: [batteryPct, connected, lastSeenAt]
              properties:
                batteryPct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
                connected: { type: boolean }
                lastSeenAt: { type: [string, 'null'], format: date-time, description: "« Dernières mesures reçues » quand le collier est déconnecté." }
            - { type: 'null' }
          description: "`null` si le chien n'a pas de collier."

    Collar:
      type: object
      required: [serialNumber, model, batteryPct, connected, lastSeenAt, assignedAt]
      properties:
        serialNumber: { type: string, description: "Code `PW-XXXXXX` (D9)." }
        model: { type: string, description: "`collar.hardware_version` ; l'app affiche « Pawrise Collar <model> »." }
        batteryPct: { type: [integer, 'null'], minimum: 0, maximum: 100, description: "Dernière mesure (TimescaleDB) ; `null` si aucune mesure reçue." }
        connected: { type: boolean, description: "Dernière mesure récente (« Signal fort » / « Déconnecté »)." }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        assignedAt: { type: string, format: date-time }

    SetCollarRequest:
      type: object
      additionalProperties: false
      required: [serialNumber]
      properties:
        serialNumber: { type: string, maxLength: 50, description: "Code scanné ou saisi, `PW-` + 6 caractères." }

    UpdatePetRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        birthDate: { type: [string, 'null'], format: date }
        sex: { type: string, enum: [male, female, unknown] }
        breedCodes: { type: array, items: { type: string }, description: Remplace toute la liste ; race principale en premier ; vide = race inconnue. }
        weightKg: { type: number, exclusiveMinimum: 0, description: Ajoute une pesée. }
        heightCm: { type: [number, 'null'], exclusiveMinimum: 0 }
        medicalNotes: { type: [string, 'null'], maxLength: 2000 }

    SamplePhotoKey:
      type: string
      enum: [sample_1, sample_2, sample_3, sample_4]
      description: "Photos d'exemple embarquées dans l'app (`pawrise-figma/src/data/mock.ts`, `samplePhotos`, dans l'ordre). Stockée telle quelle dans `pet.photo`. Ajouter un exemple = nouvelle version de l'app + ce enum."

    SamplePhotoRequest:
      type: object
      additionalProperties: false
      required: [sample]
      properties:
        sample: { $ref: '#/components/schemas/SamplePhotoKey' }

    Breed:
      type: object
      required: [code, name]
      properties:
        code: { type: string, description: "`breed_code`." }
        name: { type: string }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string, description: Jeton court (≈ 15 min). }
        refreshToken: { type: string, description: "Jeton long, à usage unique, échangé via POST /auth/refresh." }

    AuthSession:
      allOf:
        - $ref: '#/components/schemas/AuthTokens'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    Problem:
      type: object
      description: Erreur au format Problem Details (RFC 9457), convention 4.
      required: [status, code, title]
      properties:
        status: { type: integer }
        code: { type: string, description: Code stable lu par l'app. }
        title: { type: string }
        detail: { type: string }

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field: { type: string }
                  code: { type: string }
