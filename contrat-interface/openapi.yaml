openapi: 3.1.0
info:
  title: Pawrise API-CORE — app mobile
  version: 0.1.0
  description: |
    Contrat entre l'app mobile propriétaire et l'API-CORE (sprint 1).
    Conventions transverses : `conventions.md` (dates, identifiants, nommage, erreurs, pagination, en-têtes, versioning, énumérations, PATCH).
    Un endpoint marqué `x-status: provisoire` dépend d'une question ouverte de `questions.md` (`x-depends-on`).
servers:
  - url: https://api.pawrise.example/v1
    description: "Adresse à fixer (convention 7 : version dans l'URL)"

tags:
  - name: Compte
    description: Inscription, connexion, profil, suppression (C3)
  - name: Animaux
    description: Liste, ajout, édition des chiens (C4)
  - name: Colliers
    description: Association, état, remplacement du collier (C5)
  - name: Santé
    description: Score, indicateurs, séries, rappels (C6)

paths:
  /auth/register:
    post:
      tags: [Compte]
      operationId: register
      summary: Créer un compte propriétaire
      description: |
        Écran S20 Inscription (US-28). Crée le compte, enregistre l'acceptation des CGU dans la même transaction (RG11) et ouvre une session : l'app enchaîne sur la découverte (S21) sans reconnexion.

        Règles appliquées :
        - RG10 : e-mail unique, sans tenir compte de la casse → 409 `EMAIL_ALREADY_USED`.
        - RG11 : acceptation des CGU obligatoire, enregistrée dans `consent` (`terms_privacy`, version acceptée).
        - Le mot de passe est stocké haché (`password_hash`), jamais renvoyé.
      x-status: provisoire
      x-depends-on: [T1, D7, D13, D14]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              firstName: Camille
              lastName: Martin
              email: camille.martin@example.com
              phoneNumber: "+33612345678"
              password: "chien-oslo-2026"
              acceptedTermsVersion: "2026-10"
      responses:
        '201':
          description: Compte créé, session ouverte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400':
          description: |
            Données invalides (`VALIDATION_FAILED`). Codes par champ : `REQUIRED`, `INVALID_EMAIL`, `INVALID_PHONE`, `PASSWORD_TOO_SHORT`, `TERMS_NOT_ACCEPTED`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
              example:
                status: 400
                code: VALIDATION_FAILED
                title: Validation failed
                errors:
                  - { field: email, code: INVALID_EMAIL }
                  - { field: password, code: PASSWORD_TOO_SHORT }
        '409':
          description: E-mail déjà utilisé (RG10).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                status: 409
                code: EMAIL_ALREADY_USED
                title: Email already used

  /auth/login:
    post:
      tags: [Compte]
      operationId: login
      summary: Se connecter
      description: |
        Écran S19 Connexion (US-27). Ouvre une session et renvoie les jetons.

        Règles appliquées :
        - Même réponse 401 `INVALID_CREDENTIALS` si l'e-mail est inconnu ou si le mot de passe est faux : l'API ne révèle pas qu'un compte existe (la maquette affiche déjà un message unique, « E-mail ou mot de passe incorrect. »).
        - E-mail comparé sans tenir compte de la casse (RG10).
        - Trop d'essais ratés d'affilée → 429 `TOO_MANY_ATTEMPTS` (protection contre le devinage du mot de passe ; seuil fixé côté serveur).
      x-status: provisoire
      x-depends-on: [T1]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              email: camille.martin@example.com
              password: "chien-oslo-2026"
      responses:
        '200':
          description: Session ouverte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400':
          description: Champ manquant ou e-mail mal formé (`VALIDATION_FAILED`, codes `REQUIRED`, `INVALID_EMAIL`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
        '401':
          description: E-mail ou mot de passe incorrect.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                status: 401
                code: INVALID_CREDENTIALS
                title: Invalid credentials
        '429':
          description: Trop d'essais ratés, réessayer plus tard. L'en-tête `Retry-After` donne le délai en secondes.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                status: 429
                code: TOO_MANY_ATTEMPTS
                title: Too many attempts

  /auth/refresh:
    post:
      tags: [Compte]
      operationId: refreshSession
      summary: Renouveler le jeton d'accès
      description: |
        Aucun écran : l'app l'appelle seule quand le jeton d'accès expire (convention 6).
        Échange le jeton de rafraîchissement contre une nouvelle paire de jetons. L'ancien jeton de rafraîchissement devient invalide (rotation à chaque usage).

        Règles appliquées :
        - Jeton inconnu, expiré ou révoqué → 401 `INVALID_REFRESH_TOKEN` ; l'app renvoie alors vers S19 Connexion.
        - Un jeton déjà utilisé qui revient est le signe d'un vol : toute la session de cet appareil est révoquée.
      x-status: provisoire
      x-depends-on: [T1, D15]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Nouvelle paire de jetons.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401':
          description: Jeton de rafraîchissement invalide.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                status: 401
                code: INVALID_REFRESH_TOKEN
                title: Invalid refresh token

  /auth/logout:
    post:
      tags: [Compte]
      operationId: logout
      summary: Se déconnecter de cet appareil
      description: |
        Écran S17 Paramètres → S19 Connexion (US-26). Révoque le jeton de rafraîchissement envoyé : la session de cet appareil est fermée, les autres appareils restent connectés.
        Idempotent : un jeton déjà révoqué renvoie aussi 204.
      x-status: provisoire
      x-depends-on: [T1, D15]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204':
          description: Session fermée.
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me:
    get:
      tags: [Compte]
      operationId: getMe
      summary: Lire mon profil
      description: |
        Écran S17 Paramètres → Mon profil (US-22). Les initiales sont calculées par l'app à partir du nom.
      x-status: provisoire
      x-depends-on: [T1, D7]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil de l'utilisateur connecté.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    patch:
      tags: [Compte]
      operationId: updateMe
      summary: Modifier mon profil
      description: |
        Écran S17 Mon profil, bouton « Enregistrer » (US-22). Seuls les champs envoyés changent (convention 9).

        Règles appliquées :
        - RG10 : e-mail unique, sans tenir compte de la casse → 409 `EMAIL_ALREADY_USED`.
        - Changement d'e-mail accepté tout de suite (la maquette n'a pas d'étape de vérification) ; `email_verified_at` repasse à `null`.
        - `firstName`, `lastName`, `email` ne peuvent pas valoir `null` (400) ; `phoneNumber: null` efface le numéro.
      x-status: provisoire
      x-depends-on: [T1, D7]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
            example:
              email: camille.m@example.com
              phoneNumber: null
      responses:
        '200':
          description: Profil mis à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: "Données invalides (`VALIDATION_FAILED`). Codes par champ : `REQUIRED`, `INVALID_EMAIL`, `INVALID_PHONE`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: E-mail déjà utilisé par un autre compte (RG10).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                status: 409
                code: EMAIL_ALREADY_USED
                title: Email already used
    delete:
      tags: [Compte]
      operationId: deleteMe
      summary: Détruire mon compte
      description: |
        Écran S17 → S25 Détruire le compte, bouton de confirmation (US-35 chef, US-36 second). Action définitive. Les conséquences affichées par S25 viennent de `GET /pets` et `GET /pets/{id}/owners`.

        Règles appliquées (hypothèses Q1, à valider par l'équipe et l'avocate) :
        - Compte : `user_account` supprimé (profil, mot de passe), toutes les sessions révoquées (`refresh_token`), appareils (`device`) et invitations en attente envoyées supprimés.
        - Chien dont je suis second : seul mon lien *posséder* disparaît (RG16, US-36).
        - Chien dont je suis chef avec au moins un second actif → 409 `CHIEF_TRANSFER_REQUIRED` : transférer d'abord le rôle de chef (RG73, RG74). Le compte n'est pas supprimé.
        - Chien dont je suis le seul propriétaire : localisation et identité de l'animal effacées ; métriques santé anonymisées et conservées si `anonymizedDataSharing` est actif, sinon effacées ; collier dissocié et réinitialisé (US-35).
        - Rendez-vous et dossiers déjà transmis à une clinique : archivés côté Portail (hors sprint).
      x-status: provisoire
      x-depends-on: [T1, D15, Q1]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Compte détruit. L'app efface ses jetons et revient à S19 Connexion.
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Je suis chef d'au moins un chien qui a un second actif ; transférer le rôle avant de détruire le compte. `detail` cite les chiens concernés.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                status: 409
                code: CHIEF_TRANSFER_REQUIRED
                title: Chief role transfer required
                detail: "Nala"

  /me/preferences:
    get:
      tags: [Compte]
      operationId: getMyPreferences
      summary: Lire mes préférences de confidentialité
      description: |
        Écran S17 Paramètres → section Confidentialité (US-24) : les trois interrupteurs.
      x-status: provisoire
      x-depends-on: [T1, D6]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Préférences de l'utilisateur connecté.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    patch:
      tags: [Compte]
      operationId: updateMyPreferences
      summary: Modifier mes préférences de confidentialité
      description: |
        Écran S17 Confidentialité : un appel par interrupteur basculé. Seuls les champs envoyés changent (convention 9).

        Règles appliquées (hypothèses D6) :
        - `anonymizedDataSharing` est un consentement RGPD : l'activer crée une ligne `consent` (nouveau `consent_type`), le désactiver renseigne `consent_revoked_at`. Historique conservé.
        - `deviceLocationSharing` et `healthNotifications` sont des préférences du compte, sans historique.
        - Aucun champ ne peut valoir `null` (400).
      x-status: provisoire
      x-depends-on: [T1, D6]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePreferencesRequest' }
            example:
              anonymizedDataSharing: true
      responses:
        '200':
          description: Préférences mises à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400':
          description: "Données invalides (`VALIDATION_FAILED`). Code par champ : `REQUIRED`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /pets:
    get:
      tags: [Animaux]
      operationId: listPets
      summary: Lister mes chiens
      description: |
        Écran S05 Mes chiens (liste) ; sert aussi l'en-tête de S01 Santé, l'édition du chien (S05) et S25 Détruire le compte. Le chien actif est choisi et gardé par l'app (local).
        Chaque chien est complet : pas de `GET /pets/{id}` tant qu'aucun écran n'en a besoin. Liste non paginée (convention 5).

        Règles appliquées :
        - Seuls les chiens dont je suis propriétaire, chef ou second (lien *posséder*, RG15).
        - `weightKg` = dernière pesée du carnet (`health_entry`, RG8).
      x-status: provisoire
      x-depends-on: [T1, D2, D9]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mes chiens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Pet' }
              example:
                items:
                  - id: 3f6c2a1e-8b4d-4c1a-9f2e-1d2c3b4a5e6f
                    name: Nala
                    photoUrl: https://cdn.pawrise.example/pets/3f6c2a1e.jpg
                    photoSample: null
                    birthDate: "2022-04-12"
                    sex: female
                    breeds: [{ code: golden_retriever, name: Golden Retriever }]
                    weightKg: 27.4
                    heightCm: 56
                    medicalNotes: null
                    myRole: chief
                    collarSerial: PW-C28A4F
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [Animaux]
      operationId: createPet
      summary: Ajouter un chien
      description: |
        Écran S09 Ajouter un chien (US-11), étapes nom → photo → naissance → sexe → race → poids → taille → infos santé → récapitulatif. L'app appelle cet endpoint à la fin du récapitulatif, puis enchaîne sur l'association du collier (`PUT /pets/{petId}/collar`) et la photo (`POST /pets/{id}/photo`). Si l'association échoue, le chien existe sans collier (`collarSerial: null`).

        Règles appliquées :
        - Le créateur devient propriétaire chef (RG73).
        - Espèce `dog` par défaut (`species_code` obligatoire en BDD, absent de la maquette, D2).
        - `weightKg` crée une pesée dans le carnet (`health_entry`, RG8).
        - `heightCm` et `medicalNotes` : nouvelles colonnes `pet.height_cm` et `pet.medical_notes` (D2).
        - `breedCodes` : liste vide = race inconnue (« Je ne sais pas ») ; le premier code est la race principale. « Croisé » = code `mixed` (D2).
        - Date de naissance dans le futur → 400 `BIRTH_DATE_IN_FUTURE`.
      x-status: provisoire
      x-depends-on: [T1, D2]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePetRequest' }
            example:
              name: Nala
              birthDate: "2022-04-12"
              sex: female
              breedCodes: [golden_retriever]
              weightKg: 27.4
              heightCm: 56
              medicalNotes: null
      responses:
        '201':
          description: Chien créé (convention 9).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '400':
          description: "Données invalides (`VALIDATION_FAILED`). Codes par champ : `REQUIRED`, `BIRTH_DATE_IN_FUTURE`, `MUST_BE_POSITIVE`, `UNKNOWN_BREED`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /pets/{petId}:
    parameters:
      - { name: petId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Animaux]
      operationId: updatePet
      summary: Modifier le profil du chien
      description: |
        Écran S05 Mes chiens → fiche d'édition du chien (US-14), bouton « Enregistrer ». Seuls les champs envoyés changent (convention 9). La photo se change à part (`POST /pets/{petId}/photo`).

        Règles appliquées :
        - Tout propriétaire du chien, chef ou second, peut le modifier (hypothèse Q2).
        - `breedCodes` remplace toute la liste ; codes de `GET /breeds` uniquement (la fiche d'édition de la maquette saisit la race en texte libre : M5).
        - `weightKg` ajoute une pesée datée de maintenant dans le carnet (`health_entry`, RG8) ; l'historique n'est pas réécrit. `null` refusé (400).
        - `name` et `sex` ne peuvent pas valoir `null` ; `birthDate`, `heightCm`, `medicalNotes` à `null` sont effacés.
        - Chien inexistant ou d'un autre compte → 404 `PET_NOT_FOUND`.
      x-status: provisoire
      x-depends-on: [T1, D2, Q2]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePetRequest' }
            example:
              weightKg: 28.1
              medicalNotes: "Allergie au poulet."
      responses:
        '200':
          description: Chien mis à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '400':
          description: "Données invalides (`VALIDATION_FAILED`). Codes par champ : `REQUIRED`, `BIRTH_DATE_IN_FUTURE`, `MUST_BE_POSITIVE`, `UNKNOWN_BREED`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Chien inexistant ou d'un autre compte.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { status: 404, code: PET_NOT_FOUND, title: Pet not found }

  /pets/{petId}/photo:
    parameters:
      - { name: petId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Animaux]
      operationId: setPetPhoto
      summary: Changer la photo du chien
      description: |
        Écran S09 Ajouter un chien, étape photo, et S05 Édition du chien. Deux formes, selon le `Content-Type` :
        - `multipart/form-data` : ma propre photo (champ `file`, JPEG ou PNG, 1,5 Mo maximum). Stockée par Pawrise, renvoyée dans `photoUrl`.
        - `application/json` : une photo d'exemple, par sa clé (`sample`). Les images d'exemple sont embarquées dans l'app ; l'API ne stocke que la clé, renvoyée dans `photoSample`.

        Règles appliquées :
        - La nouvelle photo remplace l'ancienne (l'ancien fichier est supprimé).
        - Tout propriétaire du chien, chef ou second, peut la changer (hypothèse Q2).
        - Chien inexistant ou d'un autre compte → 404 `PET_NOT_FOUND` (convention 4).
      x-status: provisoire
      x-depends-on: [T1, Q2]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "JPEG ou PNG, 1,5 Mo maximum." }
          application/json:
            schema: { $ref: '#/components/schemas/SamplePhotoRequest' }
            example: { sample: sample_2 }
      responses:
        '200':
          description: Photo changée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '400':
          description: "Fichier ou clé invalide (`VALIDATION_FAILED`). Codes par champ : `REQUIRED`, `UNSUPPORTED_FORMAT`, `UNKNOWN_SAMPLE`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Chien inexistant ou d'un autre compte.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { status: 404, code: PET_NOT_FOUND, title: Pet not found }
        '413':
          description: Fichier de plus de 1,5 Mo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { status: 413, code: FILE_TOO_LARGE, title: File too large }

  /breeds:
    get:
      tags: [Animaux]
      operationId: listBreeds
      summary: Lister les races
      description: |
        Écran S09 Ajouter un chien, étape race (recherche), et fiche d'édition du chien (M5). Liste filtrée par `q` et bornée par `limit`, sans curseur (convention 5).

        Règles appliquées :
        - Races du chien uniquement (`species_code = dog`, D2).
        - « Croisé » est une race comme les autres (code `mixed`, D2), renvoyée en premier quand `q` est vide.
        - « Je ne sais pas » n'est pas renvoyé : l'app l'affiche elle-même et envoie une liste de races vide.
        - `q` : recherche sur le nom, sans tenir compte de la casse ni des accents.
      x-status: provisoire
      x-depends-on: [T1, D2]
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Races correspondantes, triées par nom (`mixed` en tête si `q` est vide).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Breed' }
              example:
                items:
                  - { code: mixed, name: Croisé }
                  - { code: akita_inu, name: Akita Inu }
                  - { code: beagle, name: Beagle }
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /pets/{petId}/collar:
    parameters:
      - { name: petId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Colliers]
      operationId: getPetCollar
      summary: Voir le collier du chien
      description: |
        Feuille « Collier » ouverte depuis la pastille batterie de S01 Santé (US-13) : batterie, réseau, code, modèle.

        Règles appliquées :
        - `serialNumber`, `model` : App-DB (`collar`). `batteryPct`, `lastSeenAt`, `connected` : dernière mesure reçue, lue par API-CORE dans TimescaleDB en lecture seule (RG24, D10).
        - `connected` est calculé par l'API (dernière mesure récente ; seuil fixé côté serveur, 3 min dans la maquette).
        - Chien sans collier → 404 `COLLAR_NOT_ASSIGNED` ; chien inexistant ou d'un autre compte → 404 `PET_NOT_FOUND`.
      x-status: provisoire
      x-depends-on: [T1, D10]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Collier actuel du chien.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collar' }
              example:
                serialNumber: PW-C28A4F
                model: C2
                batteryPct: 72
                connected: true
                lastSeenAt: "2026-10-30T09:12:04Z"
                assignedAt: "2026-09-02T18:40:00Z"
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Chien introuvable (`PET_NOT_FOUND`) ou sans collier (`COLLAR_NOT_ASSIGNED`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      tags: [Colliers]
      operationId: setPetCollar
      summary: Associer ou remplacer le collier du chien
      description: |
        Deux écrans, un seul endpoint (le collier du chien est remplacé par celui du code) :
        - S10 Associer un collier, après l'ajout du chien (US-12) : code `PW-XXXXXX` scanné (QR) ou saisi.
        - Feuille « Collier » → « Remplacer le collier » (US-13) : nouveau code ; l'ancien collier est dissocié.

        Règles appliquées (D9 validé : les colliers sont enregistrés par Pawrise avant la vente) :
        - Code normalisé (majuscules, sans espaces) puis cherché dans `collar.serial_number` ; inconnu ou retiré (`retired`) → 400 `UNKNOWN_COLLAR`.
        - Collier déjà affecté à un autre chien → 409 `COLLAR_ALREADY_ASSIGNED` (RG21).
        - Collier libre : passé `active` (`activated_at` à la première activation), puis nouvelle affectation `collar_assignment` (RG20, RG23).
        - Remplacement : l'affectation de l'ancien collier est clôturée (`unassigned_at`, RG22), l'ancien collier repasse `inactive` ; une notification « Nouveau collier associé » est créée pour les propriétaires (C8, D4).
        - Même code que le collier actuel : rien ne change, 200.
        - Tout propriétaire du chien, chef ou second (hypothèse Q2).
      x-status: provisoire
      x-depends-on: [T1, D4, Q2]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCollarRequest' }
            example: { serialNumber: PW-C28A4F }
      responses:
        '200':
          description: Collier associé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collar' }
        '400':
          description: "Code invalide (`VALIDATION_FAILED`). Codes par champ : `REQUIRED`, `INVALID_COLLAR_CODE` (format), `UNKNOWN_COLLAR` (absent du stock ou retiré)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Chien inexistant ou d'un autre compte.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { status: 404, code: PET_NOT_FOUND, title: Pet not found }
        '409':
          description: Collier déjà associé à un autre chien (RG21).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { status: 409, code: COLLAR_ALREADY_ASSIGNED, title: Collar already assigned }

  /pets/{petId}/health:
    parameters:
      - { name: petId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Santé]
      operationId: getPetHealth
      summary: Tableau de bord santé du chien
      description: |
        Écran S01 Santé (US-01) : score bien-être, état, message de synthèse, 5 indicateurs (valeur et état), batterie et collier connecté. Le détail d'un indicateur (message, série, plage normale) est dans `GET /pets/{petId}/health/{indicator}`.

        Règles appliquées (D10) :
        - Valeurs, batterie, connexion : lues par API-CORE dans TimescaleDB (lecture seule), sur les dernières 24 h.
        - `score`, `state`, `summary`, états des indicateurs : calculés par l'IA-ENGINE (I5). `summary` est un texte généré, donc en français, seule langue du MVP (convention 6 : pas d'en-tête de langue).
        - IA-ENGINE indisponible : 200 avec `score`, `state`, `summary` à `null` et les valeurs brutes quand même ; l'app affiche les valeurs sans score.
        - Pas encore de mesure (collier jamais connecté) ou chien sans collier : indicateurs à `null`, `collar` à `null` si aucun collier.
        - Rythme cardiaque et fibrillation : capteur non identifié (D10) ; `null` tant qu'ils ne sont pas mesurés.
        - Chien inexistant ou d'un autre compte → 404 `PET_NOT_FOUND`.
      x-status: provisoire
      x-depends-on: [T1, D10]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: État de santé actuel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthDashboard' }
              example:
                score: 87
                state: good
                summary: "Nala va bien : activité, sommeil et température dans ses habitudes."
                indicators:
                  heartRate: { state: good, heartRateBpm: 78 }
                  atrialFibrillation: { state: good, irregularBeatDetected: false }
                  activity: { state: good, activityMin: 94 }
                  sleep: { state: good, sleepMin: 450 }
                  temperature: { state: good, temperatureC: 38.6 }
                collar: { batteryPct: 72, connected: true, lastSeenAt: "2026-10-30T09:12:04Z" }
        '401':
          description: Jeton d'accès absent ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Chien inexistant ou d'un autre compte.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { status: 404, code: PET_NOT_FOUND, title: Pet not found }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Jeton d'accès court (convention 6, dépend de T1).

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email, password, acceptedTermsVersion]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        phoneNumber:
          type: [string, 'null']
          maxLength: 20
          description: Facultatif (BDD nullable ; la maquette le demande sans l'exiger). Format E.164.
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: 8 caractères minimum (hypothèse D14 ; la maquette en demande 6).
        acceptedTermsVersion:
          type: string
          maxLength: 20
          description: Version des CGU acceptée par l'utilisateur (RG11, D13).

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, maxLength: 128, writeOnly: true }

    User:
      type: object
      required: [id, firstName, lastName, email, phoneNumber, registeredAt]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phoneNumber: { type: [string, 'null'] }
        registeredAt: { type: string, format: date-time }

    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        phoneNumber:
          type: [string, 'null']
          maxLength: 20
          description: Format E.164 ; `null` efface le numéro.

    Preferences:
      type: object
      required: [deviceLocationSharing, healthNotifications, anonymizedDataSharing]
      properties:
        deviceLocationSharing:
          type: boolean
          description: Position du téléphone de l'utilisateur envoyée à Pawrise (pas celle du chien). Vrai par défaut.
        healthNotifications:
          type: boolean
          description: Alertes en cas d'anomalie de santé détectée. Vrai par défaut.
        anonymizedDataSharing:
          type: boolean
          description: Consentement à l'usage des données anonymisées pour la recherche vétérinaire. Faux par défaut (RGPD, consentement explicite).

    UpdatePreferencesRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        deviceLocationSharing: { type: boolean }
        healthNotifications: { type: boolean }
        anonymizedDataSharing: { type: boolean }

    Pet:
      type: object
      required: [id, name, photoUrl, photoSample, birthDate, sex, breeds, weightKg, heightCm, medicalNotes, myRole, collarSerial]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        photoUrl: { type: [string, 'null'], format: uri, description: "Ma propre photo, hébergée par Pawrise. `null` si photo d'exemple ou aucune photo." }
        photoSample:
          oneOf:
            - { $ref: '#/components/schemas/SamplePhotoKey' }
            - { type: 'null' }
          description: "Clé de la photo d'exemple embarquée dans l'app. `photoUrl` et `photoSample` à `null` : l'app affiche `sample_1`."
        birthDate: { type: [string, 'null'], format: date }
        sex:
          type: string
          enum: [male, female, unknown]
          description: "`unknown` = « non renseigné » dans la maquette (D2)."
        breeds:
          type: array
          description: Race principale en premier (`pet_breed.is_primary`). Liste vide = race inconnue (D2).
          items: { $ref: '#/components/schemas/Breed' }
        weightKg: { type: [number, 'null'], description: Dernière pesée. }
        heightCm: { type: [number, 'null'], description: Absent de la BDD (D2). }
        medicalNotes: { type: [string, 'null'], description: Infos santé en texte libre ; absent de la BDD (D2). }
        myRole:
          type: string
          enum: [chief, secondary]
          description: Mon rôle sur ce chien (RG15, `pet_owner.owner_role`).
        collarSerial:
          type: [string, 'null']
          description: Code du collier associé (`PW-XXXXXX` = `serial_number`, D9) ; `null` si aucun collier.

    CreatePetRequest:
      type: object
      additionalProperties: false
      required: [name, sex]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        birthDate: { type: [string, 'null'], format: date }
        sex:
          type: string
          enum: [male, female, unknown]
          description: La maquette exige mâle ou femelle ; l'API accepte aussi `unknown` (D2).
        breedCodes:
          type: array
          default: []
          items: { type: string }
          description: Codes de `GET /breeds`, race principale en premier. Vide = race inconnue.
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0 }
        heightCm: { type: [number, 'null'], exclusiveMinimum: 0 }
        medicalNotes: { type: [string, 'null'], maxLength: 2000 }

    HealthState:
      type: string
      enum: [good, watch, alert]
      description: "« Tout va bien », « À surveiller », « Alerte » dans la maquette."

    HealthDashboard:
      type: object
      required: [score, state, summary, indicators, collar]
      properties:
        score: { type: [integer, 'null'], minimum: 0, maximum: 100, description: Score bien-être (IA-ENGINE). }
        state:
          oneOf: [{ $ref: '#/components/schemas/HealthState' }, { type: 'null' }]
        summary: { type: [string, 'null'], description: Message de synthèse en langage simple (IA-ENGINE). }
        indicators:
          type: object
          required: [heartRate, atrialFibrillation, activity, sleep, temperature]
          description: Les 5 indicateurs du MVP. Chaque indicateur vaut `null` sans mesure.
          properties:
            heartRate:
              oneOf:
                - type: object
                  required: [state, heartRateBpm]
                  properties:
                    state: { $ref: '#/components/schemas/HealthState' }
                    heartRateBpm: { type: integer, description: Moyenne des dernières 24 h. }
                - { type: 'null' }
            atrialFibrillation:
              oneOf:
                - type: object
                  required: [state, irregularBeatDetected]
                  properties:
                    state: { $ref: '#/components/schemas/HealthState' }
                    irregularBeatDetected: { type: boolean }
                - { type: 'null' }
            activity:
              oneOf:
                - type: object
                  required: [state, activityMin]
                  properties:
                    state: { $ref: '#/components/schemas/HealthState' }
                    activityMin: { type: integer, description: Minutes actives depuis minuit. }
                - { type: 'null' }
            sleep:
              oneOf:
                - type: object
                  required: [state, sleepMin]
                  properties:
                    state: { $ref: '#/components/schemas/HealthState' }
                    sleepMin: { type: integer, description: Sommeil de la dernière nuit. }
                - { type: 'null' }
            temperature:
              oneOf:
                - type: object
                  required: [state, temperatureC]
                  properties:
                    state: { $ref: '#/components/schemas/HealthState' }
                    temperatureC: { type: number, description: Dernière mesure. }
                - { type: 'null' }
        collar:
          oneOf:
            - type: object
              required: [batteryPct, connected, lastSeenAt]
              properties:
                batteryPct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
                connected: { type: boolean }
                lastSeenAt: { type: [string, 'null'], format: date-time, description: "« Dernières mesures reçues » quand le collier est déconnecté." }
            - { type: 'null' }
          description: "`null` si le chien n'a pas de collier."

    Collar:
      type: object
      required: [serialNumber, model, batteryPct, connected, lastSeenAt, assignedAt]
      properties:
        serialNumber: { type: string, description: "Code `PW-XXXXXX` (D9)." }
        model: { type: string, description: "`collar.hardware_version` ; l'app affiche « Pawrise Collar <model> »." }
        batteryPct: { type: [integer, 'null'], minimum: 0, maximum: 100, description: "Dernière mesure (TimescaleDB) ; `null` si aucune mesure reçue." }
        connected: { type: boolean, description: "Dernière mesure récente (« Signal fort » / « Déconnecté »)." }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        assignedAt: { type: string, format: date-time }

    SetCollarRequest:
      type: object
      additionalProperties: false
      required: [serialNumber]
      properties:
        serialNumber: { type: string, maxLength: 50, description: "Code scanné ou saisi, `PW-` + 6 caractères." }

    UpdatePetRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        birthDate: { type: [string, 'null'], format: date }
        sex: { type: string, enum: [male, female, unknown] }
        breedCodes: { type: array, items: { type: string }, description: Remplace toute la liste ; race principale en premier ; vide = race inconnue. }
        weightKg: { type: number, exclusiveMinimum: 0, description: Ajoute une pesée. }
        heightCm: { type: [number, 'null'], exclusiveMinimum: 0 }
        medicalNotes: { type: [string, 'null'], maxLength: 2000 }

    SamplePhotoKey:
      type: string
      enum: [sample_1, sample_2, sample_3, sample_4]
      description: "Photos d'exemple embarquées dans l'app (`pawrise-figma/src/data/mock.ts`, `samplePhotos`, dans l'ordre). Stockée telle quelle dans `pet.photo`. Ajouter un exemple = nouvelle version de l'app + ce enum."

    SamplePhotoRequest:
      type: object
      additionalProperties: false
      required: [sample]
      properties:
        sample: { $ref: '#/components/schemas/SamplePhotoKey' }

    Breed:
      type: object
      required: [code, name]
      properties:
        code: { type: string, description: "`breed_code`." }
        name: { type: string }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string, description: Jeton court (≈ 15 min). }
        refreshToken: { type: string, description: "Jeton long, à usage unique, échangé via POST /auth/refresh." }

    AuthSession:
      allOf:
        - $ref: '#/components/schemas/AuthTokens'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    Problem:
      type: object
      description: Erreur au format Problem Details (RFC 9457), convention 4.
      required: [status, code, title]
      properties:
        status: { type: integer }
        code: { type: string, description: Code stable lu par l'app. }
        title: { type: string }
        detail: { type: string }

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field: { type: string }
                  code: { type: string }
