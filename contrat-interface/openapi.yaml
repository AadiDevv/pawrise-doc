    put:
      tags: [Colliers]
      operationId: setPetCollar
      summary: Associer ou remplacer le collier du chien
      description: |
        Deux écrans, un seul endpoint (le collier du chien est remplacé par celui du code) :
        - S10 Associer un collier, après l'ajout du chien (US-12) : code `PW-XXXXXX` scanné (QR) ou saisi.
        - Feuille « Collier » → « Remplacer le collier » (US-13) : nouveau code ; l'ancien collier est dissocié.

        Règles appliquées (D9 validé : les colliers sont enregistrés par Pawrise avant la vente) :
        - Code normalisé (majuscules, sans espaces) puis cherché dans `collar.serial_number` ; inconnu ou retiré (`retired`) → 400 `UNKNOWN_COLLAR`.
